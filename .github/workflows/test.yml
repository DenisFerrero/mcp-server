name: Integration & Unit Test

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '.vscode/**'
      - 'benchmark/**'
      - 'docs/**'
      - 'examples/**'
      - '*.md'

  pull_request:
    branches:
      - '**'
    paths-ignore:
      - '.vscode/**'
      - 'benchmark/**'
      - 'docs/**'
      - 'examples/**'
      - '*.md'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
        moleculer: ["0.15", "0.14"]
      fail-fast: false
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Install Moleculer 0.14 and moleculer-web 0.10
      if: matrix.moleculer == '0.14'
      run: npm install --no-save moleculer@^0.14.36 moleculer-web@^0.10.8

    - name: Type check
      run: npm run check

    - name: Run integration tests
      run: npm run test
      timeout-minutes: 15
